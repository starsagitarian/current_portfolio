name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the publish job may write packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Third-party actions are pinned to full commit SHAs; the comment names the release.

jobs:
  checks:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  database:
    name: Database tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Testcontainers starts a throwaway postgres:17-alpine on the runner's Docker.
      - run: npm run test:db

  stack:
    name: Images, compose stack, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build both images (layer cache shared with the publish job)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max

      - name: Check image sizes (under 200 MB unpacked)
        run: |
          for image in starsagitarian-api:local starsagitarian-web:local; do
            size=$(docker run --rm --entrypoint sh "$image" -c 'du -sxm / 2>/dev/null | tail -1' | cut -f1)
            echo "$image: ${size} MB" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$size" -ge 200 ]; then echo "::error::$image is ${size} MB"; exit 1; fi
          done

      - name: Start the stack
        run: docker compose up --no-build --wait --wait-timeout 120

      - name: Smoke-test the API
        run: |
          curl -fsS http://localhost:4000/health
          curl -fsS "http://localhost:4000/health?deep=1" | grep -q '"database":"up"'
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the production build
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, database, stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push (from the stack job's cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          push: true
          set: |
            api.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
            api.tags=${{ steps.names.outputs.registry }}/starsagitarian-api:latest
            api.tags=${{ steps.names.outputs.registry }}/starsagitarian-api:sha-${{ steps.names.outputs.sha }}
            web.tags=${{ steps.names.outputs.registry }}/starsagitarian-web:latest
            web.tags=${{ steps.names.outputs.registry }}/starsagitarian-web:sha-${{ steps.names.outputs.sha }}
