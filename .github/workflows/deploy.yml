name: Deploy

# Called by CI once every check has passed. Order matters: the database is migrated first, then
# the API, then the web app, so new code never runs against an old schema.
on:
  workflow_call:
    inputs:
      environment:
        description: production or preview
        required: true
        type: string

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_CLI: vercel@65.14.0
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  WEB_PROJECT: starsagitarian
  API_PROJECT: starsagitarian-api

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.web.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Vercel options
        id: vercel
        run: |
          flags="--yes --token=$VERCEL_TOKEN"
          if [ -n "$VERCEL_TEAM_ID" ]; then flags="$flags --scope=$VERCEL_TEAM_ID"; fi
          if [ "${{ inputs.environment }}" = production ]; then flags="$flags --prod"; fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      # ---- 1. Database
      - name: Neon branch
        id: neon
        run: npx tsx scripts/hosting.ts neon-branch "${{ inputs.environment }}"
      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ steps.neon.outputs.direct_url }}
          DATABASE_SSL: "true"
        run: |
          npm run db:migrate
          npm run db:seed
      # The preview branch is a copy of production: keep visitors' messages out of it.
      - name: Clear contact messages from the preview database
        if: inputs.environment == 'preview'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.direct_url }}
          DATABASE_SSL: "true"
        run: npm run db -w @starsagitarian/api -- clear-messages

      # ---- 2. API (prebuilt here, uploaded as a Vercel Build Output)
      - name: Configure the API project
        env:
          TARGET: ${{ inputs.environment }}
          DATABASE_URL: ${{ steps.neon.outputs.pooled_url }}
          PRODUCTION_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_ALERT_EMAIL: ${{ secrets.CONTACT_ALERT_EMAIL }}
        run: |
          npx tsx scripts/hosting.ts vercel-project "$API_PROJECT" api
          npx tsx scripts/hosting.ts vercel-env "$API_PROJECT" "$TARGET" DATABASE_URL
          # Random secrets, created once and then kept.
          npx tsx scripts/hosting.ts vercel-secret "$API_PROJECT" "$TARGET" IP_HASH_SALT
          if [ "$TARGET" = production ]; then
            npx tsx scripts/hosting.ts vercel-secret "$API_PROJECT" "$TARGET" CRON_SECRET
          fi
          # Previews use Cloudflare's published always-pass test secret, so the form can be tried
          # there without the real widget; production uses the real one.
          if [ "$TARGET" = preview ]; then
            export TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          else
            export TURNSTILE_SECRET_KEY="$PRODUCTION_TURNSTILE_SECRET_KEY"
          fi
          for key in TURNSTILE_SECRET_KEY RESEND_API_KEY CONTACT_ALERT_EMAIL; do
            if [ -n "${!key}" ]; then
              npx tsx scripts/hosting.ts vercel-env "$API_PROJECT" "$TARGET" "$key"
            else
              echo "::notice::$key is not set: the contact form stays off or sends no alerts until it is."
            fi
          done
      - name: Deploy the API
        id: api
        run: |
          npm run build:vercel -w @starsagitarian/api
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --cwd apps/api --project "$API_PROJECT" ${{ steps.vercel.outputs.flags }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # ---- 3. Web (built by Vercel from the uploaded source, see .vercelignore)
      - name: Configure the web project
        run: npx tsx scripts/hosting.ts vercel-project "$WEB_PROJECT" web
      - name: Deploy the web app
        id: web
        run: |
          # The site reads from the API deployed with it: the public domain in production, this
          # run's own API deployment on previews. Needed while building and while serving.
          if [ "${{ inputs.environment }}" = production ]; then
            api_url="https://$API_PROJECT.vercel.app"
          else
            api_url="${{ steps.api.outputs.url }}"
          fi
          url=$(npx --yes "$VERCEL_CLI" deploy --project "$WEB_PROJECT" --archive=tgz \
            --build-env HUSKY=0 --build-env NEXT_TELEMETRY_DISABLED=1 \
            --build-env API_URL="$api_url" --env API_URL="$api_url" \
            ${{ steps.vercel.outputs.flags }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # ---- 4. Smoke test (production uses the public domains, which serve the new deployment)
      - name: Smoke test
        env:
          # Production answers 503 on the contact form until the Turnstile secret is set.
          CONTACT_ON: ${{ inputs.environment == 'preview' || secrets.TURNSTILE_SECRET_KEY != '' }}
        run: |
          if [ "${{ inputs.environment }}" = production ]; then
            api="https://$API_PROJECT.vercel.app"; web="https://$WEB_PROJECT.vercel.app"
          else
            api="${{ steps.api.outputs.url }}"; web="${{ steps.web.outputs.url }}"
          fi
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$api/health?deep=1" | tee /dev/stderr | grep -q '"database":"up"'
          echo
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$api/v1/projects?pageSize=1" | grep -q '"items":\[{'
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w "cv %{http_code} %{content_type}\n" \
            "$api/v1/profile/cv.pdf" | tee /dev/stderr | grep -q "application/pdf"
          # An empty message is refused by validation (400), which proves the form is configured
          # without storing or sending anything.
          contact=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" \
            -d "{}" "$api/v1/contact")
          echo "contact $contact"
          if [ "$CONTACT_ON" = true ]; then [ "$contact" = 400 ]; else [ "$contact" = 503 ]; fi
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w "web %{http_code}\n" "$web"
          # the résumé page and its CV download, through the site
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$web/resume" | grep -q "Experience"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null -w "site cv %{http_code} %{content_type}\n" \
            "$web/resume/cv.pdf" | tee /dev/stderr | grep -q "application/pdf"
          {
            echo "### ${{ inputs.environment }} deployment"
            echo "| | URL |"
            echo "| --- | --- |"
            echo "| Web | $web |"
            echo "| API | $api/health?deep=1 |"
          } >> "$GITHUB_STEP_SUMMARY"
