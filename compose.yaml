# The whole stack on one machine: `docker compose up --build`
#   Web  http://localhost:3000
#   API  http://localhost:4000/health?deep=1
# Start order: db (healthy) -> migrate (tables + content, then exits) -> api (healthy) -> web.
# Local use only: the database password below is a development default, never a real secret.

name: starsagitarian

x-hardening: &hardening
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-database-env: &database-env
  DATABASE_URL: postgres://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@db:5432/${POSTGRES_DB:-portfolio}
  DATABASE_SSL: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-off job: applies pending migrations and seeds, then exits. Safe to re-run.
  migrate:
    <<: *hardening
    # Same image as the api service, which builds it.
    image: starsagitarian-api:local
    pull_policy: never
    command: ["sh", "-c", "node dist/db-cli.js migrate && node dist/db-cli.js seed"]
    environment: *database-env
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: starsagitarian-api:local
    environment: *database-env
    read_only: true
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: starsagitarian-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
